[package]
name = "saturate_spike"
version = "0.1.0"
edition = "2021"
publish = false
description = "Offline listening test for Afterecho's Saturate and its loop limit (crate adoption pass 3). Not part of the plug-in."

# Standalone: NOT a member of the plug-in workspace.
[workspace]

[dependencies]
realfft = "3.5"
softsystems-fx = { path = "../../../../Dev/nice-plug/crates/softsystems-fx", features = ["saturate", "loop-limit"] }

[profile.release]
opt-level = 3
lto = "thin"
