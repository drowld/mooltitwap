[package]
name = "afterecho"
version = "1.0.0-beta.1"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Emmanuel Bussien"]
description = "A delay of up to 16 taps, drawn and moved on one page."

[lib]
crate-type = ["cdylib", "lib"]

# Desktop standalone host — for local visual testing (`cargo run --release`).
[[bin]]
name = "afterecho"
path = "src/main.rs"

# A beta build (docs: nice-plug beta-licensing-plan.md, licence-crate.md "Beta builds"):
# the licence is `afterecho-beta` and stops at `BETA_ENDS` (lib.rs). The licence crate ties
# it to the version: with `beta` on it must be x.y.z-beta.N, and a release version must
# build without it. Afterecho is in beta, so it's on by default; the release drops it
# from `default` and the `-beta.N` from the version together.
[features]
default = ["beta"]
beta = ["softsystems-licence/beta"]

[dependencies]
# egui pinned to the exact version the fork resolves so the editor closure
# types unify; default_fonts so text renders before install_fonts runs.
egui = { version = "0.34.1", default-features = false, features = ["bytemuck", "default_fonts"] }
# The shared Epoché UI kit (theme + epo painted widgets + fonts + formatters).
crossbeam = "0.8"
# The preset store every Soft Systems plug-in shares (nice-plug's workspace).
softsystems-presets = { path = "../../Dev/nice-plug/crates/softsystems-presets" }
# The Soft Systems look: tokens, Hanken, controls, the ☰ panel, the preset sheet.
# The licence section comes once the licence is wired.
softsystems-ui = { path = "../../Dev/nice-plug/crates/softsystems-ui", default-features = false, features = ["presets", "mod", "licence"] }
softsystems-mod = { path = "../../Dev/nice-plug/crates/softsystems-mod", features = ["params"] }
# The licence check and the demo gate (nice-plug docs/licence-crate.md).
softsystems-licence = { path = "../../Dev/nice-plug/crates/softsystems-licence" }
softsystems-fx = { path = "../../Dev/nice-plug/crates/softsystems-fx", features = ["filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Detune's Clean quality (phase vocoder, v2.45).
realfft = "3.5"

[dev-dependencies]
# The tests' demo gate, `DemoGate::off()`: Cargo turns `dev` on for tests only.
softsystems-licence = { path = "../../Dev/nice-plug/crates/softsystems-licence", features = ["beta", "dev"] }

# Desktop (VST3/CLAP/standalone): `standalone` builds the local test host;
# `assert_process_allocs` keeps the RT path allocation-free. egui via baseview
# OpenGL. The xtask iOS build passes no --features, so the split MUST live here.
[target.'cfg(not(target_os = "ios"))'.dependencies]
nice-plug = { path = "../../Dev/nice-plug/crates/nice-plug", features = ["assert_process_allocs", "standalone"] }
nice-plug-egui = { path = "../../Dev/nice-plug/crates/nice-plug-egui", default-features = false, features = ["opengl"] }

# iOS (AUv3): `auv3` enables the export macro + C shim; NO `standalone`
# (baseview/jack/cpal are desktop-only) and NO `opengl` on egui (baseview has
# no UIKit backend — the crate's own iOS renderer is used instead).
[target.'cfg(target_os = "ios")'.dependencies]
nice-plug = { path = "../../Dev/nice-plug/crates/nice-plug", features = ["assert_process_allocs", "auv3"] }
nice-plug-egui = { path = "../../Dev/nice-plug/crates/nice-plug-egui", default-features = false }
