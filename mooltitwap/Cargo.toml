[package]
name = "mooltitwap"
version = "2.16.5"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Emmanuel Bussien"]
description = "Multitap delay garden, inspired by Rainbow Circuit's Petal"

[lib]
crate-type = ["cdylib", "lib"]

# Desktop standalone host — for local visual testing (`cargo run --release`).
[[bin]]
name = "mooltitwap"
path = "src/main.rs"

[dependencies]
# nice-plug — the local nih-plug fork shared with cumulus/y-flanger (a cargo
# workspace at ../../Dev/nice-plug). `standalone` builds the desktop test host;
# `assert_process_allocs` keeps the RT path allocation-free.
nice-plug = { path = "../../Dev/nice-plug/crates/nice-plug", features = ["assert_process_allocs", "standalone"] }
nice-plug-egui = { path = "../../Dev/nice-plug/crates/nice-plug-egui", default-features = false, features = ["opengl"] }
# egui pinned to the exact version the fork resolves so the editor closure
# types unify; default_fonts so text renders before install_fonts runs.
egui = { version = "0.34.1", default-features = false, features = ["bytemuck", "default_fonts"] }
# The shared Epoché UI kit (theme + epo painted widgets + fonts + formatters).
epoche-ui = { path = "../../Dev/epoche-ui" }
crossbeam = "0.8"
