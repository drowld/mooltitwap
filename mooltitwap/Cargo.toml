[package]
name = "mooltitwap"
version = "2.38.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Emmanuel Bussien"]
description = "Multitap delay garden, inspired by Rainbow Circuit's Petal"

[lib]
crate-type = ["cdylib", "lib"]

# Desktop standalone host — for local visual testing (`cargo run --release`).
[[bin]]
name = "mooltitwap"
path = "src/main.rs"

[dependencies]
# egui pinned to the exact version the fork resolves so the editor closure
# types unify; default_fonts so text renders before install_fonts runs.
egui = { version = "0.34.1", default-features = false, features = ["bytemuck", "default_fonts"] }
# The shared Epoché UI kit (theme + epo painted widgets + fonts + formatters).
epoche-ui = { path = "../../Dev/epoche-ui" }
crossbeam = "0.8"
# Named-preset serialization (one JSON file per preset in the user data dir).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop (VST3/CLAP/standalone): `standalone` builds the local test host;
# `assert_process_allocs` keeps the RT path allocation-free. egui via baseview
# OpenGL. The xtask iOS build passes no --features, so the split MUST live here.
[target.'cfg(not(target_os = "ios"))'.dependencies]
nice-plug = { path = "../../Dev/nice-plug/crates/nice-plug", features = ["assert_process_allocs", "standalone"] }
nice-plug-egui = { path = "../../Dev/nice-plug/crates/nice-plug-egui", default-features = false, features = ["opengl"] }

# iOS (AUv3): `auv3` enables the export macro + C shim; NO `standalone`
# (baseview/jack/cpal are desktop-only) and NO `opengl` on egui (baseview has
# no UIKit backend — the crate's own iOS renderer is used instead).
[target.'cfg(target_os = "ios")'.dependencies]
nice-plug = { path = "../../Dev/nice-plug/crates/nice-plug", features = ["assert_process_allocs", "auv3"] }
nice-plug-egui = { path = "../../Dev/nice-plug/crates/nice-plug-egui", default-features = false }
